schema_version: 1
documentation: docs/http-contract.md
api_base: /api/v1/users
api:
  - {method: GET, path: /me}
  - {method: GET, path: '/:id'}
  - {method: PATCH, path: /me}
  - {method: POST, path: /me/avatar}
  - {method: GET, path: /me/identities}
  - {method: POST, path: /me/identities}
  - {method: DELETE, path: '/me/identities/:provider/:provider_user_id'}
admin_base: /admin/v1/users
admin_methods: [GET collection, GET item, POST collection, PATCH item, PATCH item status, PATCH item role]
internal:
  - {method: GET, path: /internal/health}
  - {method: POST, path: /internal/v1/users/active/resolve, auth: X-Internal-Token, max_body_bytes: 65536, max_ids: 1000}
avatar_image_maintenance:
  env: IMAGE_PROCESSING_MAINTENANCE
  default: false
  scope: EAGER_avatar_upload_only
  before_effects: [filestorage_upload, profile_update]
  rejected: {status: 503, retry_after_seconds: 1, code: image_processing_maintenance}
  post_upload_failure: image_processing_outcome_unknown_reconcile
  old_process_transition: unproven
