services:
  user-service:
    container_name: ms-user-service
    build:
      context: .
      dockerfile: build/docker/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - ms-net

  postgres:
    container_name: ms-user-postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js"]

  migrate:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: build/docker/Dockerfile
    environment:
      DB_DSN: "postgres://${DB_USER:-app}:${DB_PASSWORD:-app_password}@postgres:5432/${DB_NAME:-userdb}?sslmode=${DB_SSLMODE:-disable}"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/user-service-migrate"]

  nginx:
    container_name: ms-user-nginx
    image: nginx:1.25-alpine
    depends_on:
      - user-service
    volumes:
      - ./build/docker/nginx/nginx.conf.tmpl:/etc/nginx/templates/default.conf.template:ro
    env_file:
      - .env
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8000}:80"

volumes:
  pgdata:

networks:
  ms-net:
    # A project-managed network keeps this standalone Docker path runnable on
    # a fresh machine. Integrations can attach another network through an
    # ignored docker-compose.override.yml.
