version: '3'

dotenv: ['.env']

vars:
  DB_CONTAINER: postgres
  DB_USER: '{{.DB_USER | default "app"}}'
  DB_PASSWORD: '{{.DB_PASSWORD | default "app_password"}}'
  DB_NAME: '{{.DB_NAME | default "userdb"}}'
  DB_SSLMODE: '{{.DB_SSLMODE | default "disable"}}'

tasks:
  up:
    desc: Start full local stack (service + nginx + dependencies)
    cmds:
      - docker compose up -d --build

  up-db:
    desc: Start only Postgres container
    cmds:
      - docker compose up -d {{.DB_CONTAINER}}

  migrate-up:
    desc: Apply migrations to the standalone Docker PostgreSQL service
    cmds:
      - docker compose --profile migration run --rm migrate up

  migrate-down:
    desc: Roll back all migrations in the standalone Docker PostgreSQL service
    cmds:
      - docker compose --profile migration run --rm migrate down

  down:
    desc: Stop containers
    cmds:
      - docker compose down

  migrate-status:
    desc: Show migration status for the standalone Docker PostgreSQL service
    cmds:
      - docker compose --profile migration run --rm migrate status

  migrate:native:
    desc: Apply migrations to shared native PostgreSQL using the infrastructure local environment
    cmds:
      - python3 scripts/native_config.py -- go run ./cmd/user-service-migrate up

  migrate:native-status:
    desc: Inspect shared native PostgreSQL migration state without reading table rows
    cmds:
      - python3 scripts/native_config.py -- go run ./cmd/user-service-migrate status

  create-rbac-db:
    desc: Create rbacdb database in the same Postgres instance if it does not exist
    cmds:
      - |
        docker compose exec -T {{.DB_CONTAINER}} psql -U {{.DB_USER}} -d postgres -v ON_ERROR_STOP=1 -c "SELECT 1 FROM pg_database WHERE datname='rbacdb'" >/dev/null 2>&1 \
          || docker compose exec -T {{.DB_CONTAINER}} psql -U {{.DB_USER}} -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rbacdb"

  create-auth-db:
    desc: Create authdb database in the same Postgres instance if it does not exist
    cmds:
      - |
        docker compose exec -T {{.DB_CONTAINER}} psql -U {{.DB_USER}} -d postgres -v ON_ERROR_STOP=1 -c "SELECT 1 FROM pg_database WHERE datname='authdb'" >/dev/null 2>&1 \
          || docker compose exec -T {{.DB_CONTAINER}} psql -U {{.DB_USER}} -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE authdb"

  run:
    desc: Run service locally
    cmds:
      - go run ./cmd/user-service

  run:native:
    desc: Run User Service on macOS against shared PostgreSQL and NATS
    cmds:
      - python3 scripts/native_config.py -- go run ./cmd/user-service

  test:
    desc: Run tests
    cmds:
      - go test ./...
      - python3 test/unit/native_config_test.py

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...
